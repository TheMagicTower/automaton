name: CD — Release Build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-app:
    name: Build .app Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: Swatinem/rust-cache@v2

      - name: Run all tests
        run: cargo test --workspace

      - name: Build .app bundle
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          plutil -lint build/Automaton.app/Contents/Info.plist
          test -x build/Automaton.app/Contents/MacOS/Automaton
          echo "Bundle verified"

      - name: Zip for release
        run: |
          cd build
          zip -r Automaton-macOS.zip Automaton.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automaton-macOS
          path: build/Automaton-macOS.zip
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Automaton-macOS.zip
          generate_release_notes: true
