name: Automaton
options:
  bundleIdPrefix: com.themagictower
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Automaton:
    type: application
    platform: macOS
    sources:
      - Sources/Automaton
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themagictower.automaton
        PRODUCT_NAME: Automaton
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Automaton
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Push-to-Talk 음성 입력을 위해 마이크 접근이 필요합니다."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "음성 명령 인식을 위해 음성 인식 권한이 필요합니다."
        ENABLE_HARDENED_RUNTIME: NO
